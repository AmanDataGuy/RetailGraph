# RetailGraph — golden evaluation set.
#
# 30 hand-built queries with expected_result_count and gold_cypher verified
# directly against the live Neo4j graph (2,160 products / 6,248 relationships,
# checked 2026-07-26). expected_intent/route describe what the agent SHOULD
# pick; the eval runner checks the agent's actual choice against these.
#
# q30 ("allergen-free products") must return 0: no product carries that tag.

- id: q1
  query: "vegan gluten-free snacks under $10"
  type: multi_constraint_filter
  expected_intent: filter
  expected_route: cypher
  expected_result_count: 21
  gold_cypher: >
    MATCH (p:Product)-[:BELONGS_TO]->(c:Category {name:'Snacks & Candy'})
    MATCH (p)-[:HAS_TAG]->(:DietaryTag {name:'vegan'})
    MATCH (p)-[:HAS_TAG]->(:DietaryTag {name:'gluten-free'})
    WHERE p.price <= 10 RETURN count(p)

- id: q2
  query: "gluten-free beverages with no peanuts"
  type: allergen_exclusion
  expected_intent: filter
  expected_route: cypher
  expected_result_count: 31
  gold_cypher: >
    MATCH (p:Product)-[:BELONGS_TO]->(c:Category {name:'Beverages'})
    MATCH (p)-[:HAS_TAG]->(:DietaryTag {name:'gluten-free'})
    WHERE NOT EXISTS { MATCH (p)-[:CONTAINS_ALLERGEN]->(a:Allergen) WHERE a.name CONTAINS 'peanut' }
    RETURN count(p)

