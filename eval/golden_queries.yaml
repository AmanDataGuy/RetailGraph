- id: q21
  query: "what categories does McCormick sell in"
  type: analytics
  expected_intent: analytics
  expected_route: analytics
  expected_result_count: 6
  gold_cypher: >
    MATCH (p:Product)-[:MADE_BY]->(b:Brand {name:'McCormick'})
    MATCH (p)-[:BELONGS_TO]->(c:Category)
    RETURN count(DISTINCT c.name)
  notes: "6 named categories + 1 'Unknown' bucket = 7 distinct rows in the raw graph; the agent's analytics templates only report named categories, so 6 is the expected surfaced answer."

