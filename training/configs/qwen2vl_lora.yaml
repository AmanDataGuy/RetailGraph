# qwen2vl_lora.yaml - hyperparameters for training/finetune_qwen.py (QLoRA on Qwen2-VL-7B)
# - Read locally by `modal run training/finetune_qwen.py` and sent to the Modal A100 as a dict.
# - Keys marked "(unused)" are not read by finetune_qwen.py; changing them has no effect.

model:
  name: "Qwen/Qwen2-VL-7B-Instruct"
  load_in_4bit: true            # QLoRA: ~4GB of weights instead of ~14GB
  compute_dtype: "bfloat16"     # (unused) dtype is auto-detected
  max_seq_length: 2048          # one example (system + user + assistant) must fit


lora:
  r: 16                         # adapter size; plenty for schema-following
  lora_alpha: 32                # 2 x r
  lora_dropout: 0.05
  target_modules:               # attention + feed-forward projections
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  train_on_responses_only: true # (unused) the collator is not told to mask prompt tokens
  use_gradient_checkpointing: "unsloth"   # recompute activations to save VRAM


training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # effective batch = 4 x 8 = 32
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_steps: 50
  optim: "paged_adamw_8bit"
  logging_steps: 10
  eval_steps: 100               # passed through, but eval_strategy is "no" in finetune_qwen.py
  save_steps: 100
  save_total_limit: 3           # keeps the 3 most recent checkpoints
  bf16: true
  seed: 42


data:
  train_file: "data/training/train.jsonl"   # (unused) finetune_qwen.py reads /data/training/train_r3.jsonl
  val_file: "data/training/val.jsonl"       # (unused) finetune_qwen.py reads /data/training/val.jsonl
  images_dir: "data/images/train"           # (unused) finetune_qwen.py reads /data/images/train
  load_images: true                         # (unused)
  dataloader_num_workers: 4


output:                         # (unused) outputs go to /models/checkpoints and /models/qwen2vl_retailgraph_v1
  checkpoint_dir: "outputs/checkpoints"
  final_model_dir: "outputs/qwen2vl_retailgraph_v1"
  merge_adapter: true
  save_in_16bit: true


mlflow:
  experiment_name: "retailgraph-phase5-finetune"
  run_name: "qwen2vl-7b-lora-seed-v1"
  tracking_uri: "./mlruns"      # (unused) finetune_qwen.py logs to /models/mlruns
  log_model: false              # (unused) model is too large for MLflow
