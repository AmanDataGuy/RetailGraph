services:

  # Local Neo4j — replaces the AuraDB Free dependency, which auto-pauses
  # (and apparently gets deleted) after a few days idle, breaking dev/test
  # sessions with no warning. Same engine, same Cypher, pinned to match the
  # neo4j==5.20.0 Python driver already in requirements*.txt.
  neo4j:
    image: neo4j:5.20.0
    container_name: retailgraph-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      - NEO4J_AUTH=neo4j/retailgraph_local
      - NEO4J_server_memory_pagecache_size=512M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Local Qdrant — same version as qdrant-client in requirements*.txt.
  # Replaces Qdrant Cloud, whose free cluster is suspended when idle.
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: retailgraph-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: retailgraph-api
    command: uvicorn retailgraph.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Talk to the containers above, whatever .env says (it may point at cloud hosts).
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=retailgraph_local
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  streamlit:
    build: .
    container_name: retailgraph-ui
    command: streamlit run src/retailgraph/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000   # reach the api container, not localhost
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
